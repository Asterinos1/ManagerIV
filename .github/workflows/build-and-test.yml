name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (.NET 8 Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore GtaIVModLoader.sln

    - name: Build Solution
      run: dotnet build GtaIVModLoader.sln --configuration Release --no-restore

    - name: Run xUnit Unit Tests
      run: dotnet test GtaIVModLoader.sln --configuration Release --no-build --verbosity normal
